services:
  marzban-node:
    image: gozargah/marzban-node:latest
    restart: always
    network_mode: host

    volumes:
      - /var/lib/marzban-node:/var/lib/marzban-node
    environment:
      SSL_CLIENT_CERT_FILE: "/var/lib/marzban-node/ssl_client_cert.pem"
      SERVICE_PROTOCOL: "rest"

# Hysteria2 is added via docker-compose.override.yml (auto-generated by setup-hysteria-node.sh).
# Do not add it here — override is merged automatically by Docker Compose.
