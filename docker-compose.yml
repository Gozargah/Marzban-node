services:
  marzban-node:
    # build: .
    image: gozargah/marzban-node:latest
    restart: always
    network_mode: host

    # env_file: .env
    environment:
      SSL_CERT_FILE: "/var/lib/marzban-node/ssl_cert.pem"
      SSL_KEY_FILE: "/var/lib/marzban-node/ssl_key.pem"
      # SSL_CLIENT_CERT_FILE: "/var/lib/marzban-node/ssl_client_cert.pem"
      # SERVICE_PROTOCOL: "rest"

    volumes:
      - /var/lib/marzban-node:/var/lib/marzban-node

  # Hysteria2 sidecar — authenticates users against the MAIN Marzban server.
  # Enable by setting HYSTERIA2_ENABLED=true and running setup-hysteria-node.sh first.
  hysteria2:
    image: tobyxdd/hysteria:latest
    restart: always
    network_mode: host
    profiles:
      - hysteria2
    depends_on:
      - marzban-node
    volumes:
      - /var/lib/marzban-node:/var/lib/marzban-node:ro
      - /var/lib/marzban-node/hysteria.yaml:/etc/hysteria/config.yaml:ro
    command: server
