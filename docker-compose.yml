services:
  marzban-node:
    build: .
    restart: always
    network_mode: host

    volumes:
      - /var/lib/marzban-node:/var/lib/marzban-node
      - /var/lib/marzban:/var/lib/marzban
    environment:
      SSL_CLIENT_CERT_FILE: "/var/lib/marzban-node/ssl_client_cert.pem"
      SERVICE_PROTOCOL: "rest"

# Sidecars such as Hysteria2 and MTProto are added via docker-compose.override.yml.
# Do not add them here — override is merged automatically by Docker Compose.
